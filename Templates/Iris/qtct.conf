[ColorScheme]
# Generated by iris. Do not edit; edit the shell's Templates/Iris/qtct.conf..
# Consumed by qt5ct and qt6ct (Fusion style, custom_palette=true).
#
# https://doc.qt.io/qt-6/qpalette.html
# Value order (22 entries; the 22nd, accent, is Qt6-only and ignored by Qt5):
# windowText, button, light, midlight, dark, mid, text, brightText,
# buttonText, base, window, shadow, highlight, highlightedText, link,
# linkVisited, alternateBase, NoRole, toolTipBase, toolTipText,
# placeholderText, accent
#
# Only bg/surface/dim/fg/accent are used. iris swaps the meaning of
# color0/color8/color15 between light and dark wallpapers, and a flat
# hex file has no way to branch on the mode, so those are avoided here.
# bg -> surface -> dim -> fg keeps the same ordering in both modes:
#   window/button = surface, views = bg, borders and shading = dim.
# Fusion's light/midlight/dark/mid/shadow bevel roles all collapse onto
# dim: a single mid-tone border reads correctly either way round, where
# a guessed light/dark pair would invert on half the wallpapers.

active_colors={fg}, {surface}, {dim}, {dim}, {dim}, {dim}, {fg}, {fg}, {fg}, {bg}, {surface}, {dim}, {accent}, {bg}, {accent}, {dim}, {surface}, {bg}, {surface}, {fg}, {dim}, {accent}
inactive_colors={fg}, {surface}, {dim}, {dim}, {dim}, {dim}, {fg}, {fg}, {fg}, {bg}, {surface}, {dim}, {dim}, {bg}, {accent}, {dim}, {surface}, {bg}, {surface}, {fg}, {dim}, {accent}
disabled_colors={dim}, {surface}, {dim}, {dim}, {dim}, {dim}, {dim}, {dim}, {dim}, {bg}, {surface}, {dim}, {surface}, {dim}, {dim}, {dim}, {surface}, {bg}, {surface}, {dim}, {dim}, {dim}
